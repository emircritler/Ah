<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline RPG</title>
    <style>
      html, body, #app {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #07170d;
        touch-action: none;
        user-select: none;
      }

      body {
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
